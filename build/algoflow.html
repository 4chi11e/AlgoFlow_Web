<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style data-inline-source="styles.css">
:root {
  --bg: #f3efe7;
  --bg-accent: #e6dccf;
  --panel: rgba(255, 250, 242, 0.96);
  --panel-strong: #fff8ef;
  --line: rgba(74, 58, 43, 0.22);
  --surface-border: rgba(74, 58, 43, 0.24);
  --control-bg: #fff7ec;
  --control-bg-hover: #ffefdd;
  --control-border: rgba(74, 58, 43, 0.3);
  --text: #2f2419;
  --muted: #6f6253;
  --primary: #c45c2d;
  --primary-dark: #9d471f;
  --secondary: #1f5c5b;
  --shadow: 0 20px 60px rgba(74, 58, 43, 0.16);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --workspace-sidebar-size: 380px;
  --sidebar-top-size: 55%;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #12161c;
  --bg-accent: #1b2430;
  --panel: rgba(24, 30, 39, 0.9);
  --panel-strong: #1c232d;
  --line: rgba(221, 228, 240, 0.12);
  --surface-border: rgba(221, 228, 240, 0.12);
  --control-bg: rgba(255, 255, 255, 0.06);
  --control-bg-hover: rgba(255, 255, 255, 0.1);
  --control-border: rgba(255, 255, 255, 0.1);
  --text: #e7edf7;
  --muted: #97a5b7;
  --primary: #d37445;
  --primary-dark: #ab572e;
  --secondary: #7ac9c8;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: "Manrope", sans-serif;
  color: var(--text);
  background: var(--bg);
}

:root[data-theme="dark"] body {
  background: var(--bg);
}

body.is-drag-selecting {
  user-select: none;
}

button,
input {
  font: inherit;
}

.app-shell {
  height: 100vh;
  padding: 14px;
  overflow: hidden;
}

.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 24px;
  margin-bottom: 20px;
}

.topbar-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.topbar-group-start {
  justify-content: flex-start;
}

.topbar-group-end {
  justify-content: flex-end;
}

.app-shell.is-topbar-start-overflow .topbar-group-start {
  flex-wrap: nowrap;
  gap: 4px;
}

.app-shell.is-topbar-start-overflow .topbar-group-start .ghost-button,
.app-shell.is-topbar-start-overflow .topbar-group-start .primary-button {
  padding: 0.58rem 0.65rem;
  font-size: 0.85rem;
  letter-spacing: -0.02em;
}

.app-shell.is-topbar-start-overflow #theme-toggle-button {
  font-size: 0.8rem;
  padding: 0.55rem 0.6rem;
}

.topbar-brand {
  text-align: center;
}

.topbar-brand-text {
  display: block;
}

.mobile-topbar-menu-toggle {
  display: none;
}

.eyebrow,
.panel-kicker {
  margin: 0 0 6px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--primary);
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1,
h2,
h3 {
  font-family: "Space Grotesk", sans-serif;
}

h1 {
  font-size: clamp(1.8rem, 2vw, 2.5rem);
}

.topbar-actions,
.language-tabs {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.topbar-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 0.72rem 1rem;
  border: 1px solid var(--control-border);
  border-radius: 999px;
  background: var(--control-bg);
  color: var(--text);
  cursor: pointer;
  user-select: none;
  box-shadow: 0 2px 8px rgba(74, 58, 43, 0.08);
  transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}

.topbar-toggle input {
  margin: 0;
  accent-color: var(--primary);
}

.topbar-toggle span {
  font-size: 0.95rem;
}

.ghost-button,
.primary-button {
  border: 1px solid var(--control-border);
  border-radius: 999px;
  padding: 0.72rem 1rem;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(74, 58, 43, 0.08);
  transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
}

.ghost-button {
  background: var(--control-bg);
  color: var(--text);
}

.primary-button {
  background: var(--primary);
  border-color: rgba(99, 45, 20, 0.45);
  color: #fffaf5;
}

.topbar-toggle:hover,
.ghost-button:hover,
.primary-button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(74, 58, 43, 0.14);
}

.topbar-toggle:hover,
.ghost-button:hover {
  background: var(--control-bg-hover);
  border-color: rgba(74, 58, 43, 0.42);
}

.primary-button:hover {
  background: var(--primary-dark);
  border-color: rgba(75, 31, 12, 0.56);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.56;
  transform: none !important;
  box-shadow: none !important;
}

:root[data-theme="dark"] .topbar-toggle,
:root[data-theme="dark"] .ghost-button,
:root[data-theme="dark"] .language-tab,
:root[data-theme="dark"] .property-field input,
:root[data-theme="dark"] .property-field textarea,
:root[data-theme="dark"] .console-input-row input,
:root[data-theme="dark"] .property-button {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  border-color: rgba(255, 255, 255, 0.08);
}

:root[data-theme="dark"] .primary-button {
  color: #fff7f1;
}

:root[data-theme="dark"] .panel {
  border-color: rgba(255, 255, 255, 0.08);
}

:root[data-theme="dark"] .workspace-resizer::before {
  background: rgba(255, 255, 255, 0.08);
}

:root[data-theme="dark"] .mobile-selection-button {
  background: rgba(28, 35, 45, 0.94);
  border-color: rgba(221, 228, 240, 0.14);
  color: var(--text);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.34);
}

:root[data-theme="dark"] .mobile-selection-button:hover,
:root[data-theme="dark"] .mobile-selection-button:focus-visible {
  background: rgba(36, 45, 57, 0.98);
}

:root[data-theme="dark"] .mobile-selection-button.is-active {
  background: rgba(82, 164, 163, 0.94);
  border-color: rgba(119, 201, 200, 0.62);
  color: #0e171f;
}

:root[data-theme="dark"] .mobile-selection-button.mobile-selection-button-danger {
  background: rgba(211, 116, 69, 0.96);
  border-color: rgba(171, 87, 46, 0.58);
  color: #1b1010;
}

:root[data-theme="dark"] .mobile-selection-button.mobile-selection-button-danger:hover,
:root[data-theme="dark"] .mobile-selection-button.mobile-selection-button-danger:focus-visible {
  background: rgba(182, 92, 52, 0.98);
}

:root[data-theme="dark"] .folder-tabs::after {
  border-bottom-color: rgba(255, 255, 255, 0.08);
}

:root[data-theme="dark"] .table-row {
  border-top-color: rgba(255, 255, 255, 0.08);
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 16px minmax(320px, var(--workspace-sidebar-size));
  gap: 0;
  height: calc(100vh - 98px);
  min-height: 0;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--surface-border);
  box-shadow: var(--shadow);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(14px);
}

.diagram-panel,
.sidebar-panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.diagram-panel {
  overflow: hidden;
}

.workspace-resizer {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: col-resize;
  user-select: none;
  touch-action: none;
}

.workspace-resizer::before {
  content: "";
  width: 1px;
  height: 100%;
  background: rgba(74, 58, 43, 0.2);
  position: absolute;
}

.workspace-resizer-handle {
  position: relative;
  z-index: 1;
  width: 8px;
  height: 58px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(226, 207, 183, 0.98), rgba(196, 174, 146, 0.98));
  border: 1px solid rgba(74, 58, 43, 0.24);
  box-shadow: 0 2px 8px rgba(74, 58, 43, 0.12);
}

.workspace-resizer.is-dragging .workspace-resizer-handle,
.workspace-resizer:hover .workspace-resizer-handle {
  background: linear-gradient(180deg, rgba(196, 92, 45, 0.9), rgba(165, 74, 35, 0.92));
  border-color: transparent;
}

.diagram-canvas {
  position: relative;
  flex: 1;
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  border-radius: 20px;
  border: 1px solid rgba(74, 58, 43, 0.22);
  background: linear-gradient(180deg, rgba(255, 250, 242, 1), rgba(237, 226, 211, 0.96));
  min-height: 0;
}

.mobile-selection-controls {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 8;
  display: none;
  flex-direction: column;
  gap: 8px;
}

.mobile-selection-button {
  border: 1px solid var(--control-border);
  border-radius: 999px;
  background: rgba(255, 247, 236, 0.94);
  color: var(--text);
  font-family: "Space Grotesk", sans-serif;
  font-size: 0.86rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  padding: 0.58rem 0.9rem;
  box-shadow: 0 8px 22px rgba(74, 58, 43, 0.2);
  backdrop-filter: blur(8px);
  cursor: pointer;
  transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease, border-color 160ms ease;
}

.mobile-selection-button:hover,
.mobile-selection-button:focus-visible {
  transform: translateY(-1px);
  box-shadow: 0 12px 24px rgba(74, 58, 43, 0.22);
  background: rgba(255, 240, 221, 0.98);
}

.mobile-selection-button.is-active {
  background: rgba(31, 92, 91, 0.96);
  border-color: rgba(16, 56, 55, 0.64);
  color: #f5fbfb;
}

.mobile-selection-button.mobile-selection-button-danger {
  background: rgba(196, 92, 45, 0.96);
  border-color: rgba(99, 45, 20, 0.48);
  color: #fff8f4;
}

.mobile-selection-button.mobile-selection-button-danger:hover,
.mobile-selection-button.mobile-selection-button-danger:focus-visible {
  background: rgba(157, 71, 31, 0.98);
}

.diagram-canvas.is-panning {
  cursor: grabbing;
}

.flowchart-root {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  justify-content: center;
}

.main-content {
  flex: 1;
  padding: 0 14px 14px;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.main-view {
  position: relative;
  display: none;
  flex: 1;
  min-height: 0;
}

.main-view.is-active {
  display: flex;
}

.folder-tabs {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px 0;
  position: relative;
}

.folder-tab-list {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  min-width: 0;
}

.folder-tabs-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
}

.history-actions {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.focus-toggle-button {
  position: relative;
  z-index: 1;
  margin-bottom: 6px;
  min-width: 84px;
}

.focus-toggle-button.is-active {
  background: rgba(196, 92, 45, 0.16);
  color: var(--primary-dark);
}

.touch-selection-override-button.is-active {
  background: rgba(31, 92, 91, 0.16);
  color: var(--secondary);
  border-color: rgba(31, 92, 91, 0.34);
}

.history-button {
  width: 42px;
  height: 42px;
  border: 1px solid var(--control-border);
  border-radius: 999px;
  background: var(--control-bg);
  color: var(--text);
  cursor: pointer;
  font-size: 1.15rem;
  line-height: 1;
  transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  box-shadow: 0 2px 8px rgba(74, 58, 43, 0.08);
}

.history-button-icon {
  display: inline-block;
  font-size: 1.3rem;
  font-weight: 700;
  transform: translateY(-1px);
}

.history-button:hover,
.history-button:focus-visible {
  transform: translateY(-1px);
  background: var(--control-bg-hover);
  border-color: rgba(74, 58, 43, 0.42);
  box-shadow: 0 8px 18px rgba(74, 58, 43, 0.14);
  outline: none;
}

.folder-tabs::after {
  content: "";
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 0;
  border-bottom: 1px solid rgba(74, 58, 43, 0.22);
}

.folder-tab {
  position: relative;
  z-index: 1;
  border: 1px solid rgba(74, 58, 43, 0.18);
  border-bottom: 0;
  background: linear-gradient(180deg, rgba(239, 225, 207, 0.98), rgba(222, 204, 180, 0.98));
  color: var(--muted);
  padding: 0;
  margin: 0;
  min-width: 138px;
  border-radius: 16px 16px 0 0;
  cursor: pointer;
  transition: transform 160ms ease, background-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
}

.folder-tab::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 18px;
  width: 44px;
  height: 14px;
  border-radius: 10px 10px 0 0;
  background: inherit;
  border: 1px solid rgba(74, 58, 43, 0.18);
  border-bottom: 0;
}

.folder-tab-label {
  display: block;
  padding: 14px 20px 12px;
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.folder-tab:hover {
  transform: translateY(-2px);
  color: var(--text);
}

.folder-tab.is-active {
  background: linear-gradient(180deg, rgba(255, 250, 242, 1), rgba(250, 239, 225, 1));
  color: var(--text);
  border-color: rgba(74, 58, 43, 0.28);
  box-shadow: 0 -6px 14px rgba(74, 58, 43, 0.08);
}

.folder-tab.is-active::before {
  border-color: var(--line);
}

.folder-tab.is-active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: rgba(250, 239, 225, 1);
}

.folder-toggle {
  position: relative;
  z-index: 1;
  margin-bottom: 6px;
  white-space: nowrap;
}

.app-shell.is-focus-mode {
  padding: 10px;
}

.app-shell.is-focus-mode .topbar,
.app-shell.is-focus-mode .sidebar-panel,
.app-shell.is-focus-mode .workspace-resizer {
  display: none;
}

.app-shell.is-focus-mode .workspace {
  grid-template-columns: minmax(0, 1fr);
  height: calc(100vh - 20px);
}

.app-shell.is-focus-mode .diagram-panel {
  position: fixed;
  inset: 10px;
  z-index: 40;
  border-radius: 30px;
}

.app-shell.is-focus-mode .folder-tabs {
  padding-top: 14px;
}

.app-shell.is-focus-mode .folder-tab-list {
  display: none;
}

.app-shell.is-focus-mode .folder-tabs-actions {
  width: 100%;
  justify-content: flex-end;
}

.app-shell.is-focus-mode .main-content {
  padding-top: 8px;
}

.app-shell.is-focus-mode .diagram-canvas {
  border-radius: 24px;
}

.canvas-grid {
  position: absolute;
  inset: 0;
  background: transparent;
}

.selection-box {
  position: absolute;
  z-index: 3;
  border: 1px solid rgba(29, 95, 168, 0.68);
  background: rgba(29, 95, 168, 0.14);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32);
  pointer-events: none;
}

.diagram-svg {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: auto;
}

.svg-terminal-shape {
  fill: #e7d7fa;
  stroke: #9c78b2;
  stroke-width: 3;
}

.svg-terminal-label,
.svg-node-label {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #2f2419;
  font-family: "Space Grotesk", sans-serif;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
}

.svg-terminal-label {
  font-size: 1.15rem;
  font-weight: 500;
}

.svg-node-label {
  display: grid;
  align-items: center;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: 0;
  font-size: 1rem;
  line-height: 1.2;
  overflow: hidden;
}

.svg-node-label-inner {
  width: 100%;
  padding: 2px 4px;
  box-sizing: border-box;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: normal;
  text-align: center;
}

.node-label-content {
  display: block;
  width: 100%;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

.node-label-prefix {
  display: block;
  text-align: center;
  font-weight: 700;
  margin-bottom: 0.16rem;
}

.node-label-body {
  display: block;
  text-align: inherit;
}

.svg-node-label-comment {
  align-items: start;
  text-align: left;
}

.svg-node-label-comment .svg-node-label-inner {
  align-self: stretch;
  padding-top: 6px;
  text-align: left;
}

.svg-node-shape {
  stroke-width: 2.5;
  transition: filter 160ms ease, stroke 160ms ease, transform 160ms ease;
}

.svg-node-input .svg-node-shape {
  fill: #d9d9d9;
  stroke: #6f6f6f;
}

.svg-node-output .svg-node-shape {
  fill: #daf8d8;
  stroke: #8fb88f;
}

.svg-node-declare .svg-node-shape {
  fill: #dff4ee;
  stroke: #7ba79a;
}

.svg-node-assign .svg-node-shape {
  fill: #fbf8c9;
  stroke: #c1b77d;
}

.svg-node-call .svg-node-shape {
  fill: #e3d0f5;
  stroke: #9f82bc;
}

.svg-node-if .svg-node-shape {
  fill: #ffd8dd;
  stroke: #c48d97;
}

.svg-node-while .svg-node-shape,
.svg-node-for .svg-node-shape,
.svg-node-do .svg-node-shape {
  fill: #ffe3b4;
  stroke: #c39a59;
}

.svg-node-comment .svg-node-shape {
  fill: rgba(255, 255, 255, 0.72);
  stroke: #7a7a7a;
  stroke-dasharray: 6 5;
}

.svg-node-hit {
  fill: transparent;
  cursor: pointer;
  pointer-events: all;
}

.svg-node.is-selected .svg-node-shape {
  filter: saturate(1.25) brightness(0.92);
  stroke: #1d5fa8;
  stroke-width: 3.5;
}

.svg-node.is-executing .svg-node-shape {
  filter: saturate(1.18) brightness(0.98);
  stroke: #c45c2d;
  stroke-width: 4;
}

.svg-node.is-preview-selected:not(.is-selected) .svg-node-shape {
  filter: saturate(1.12) brightness(0.96);
  stroke: rgba(29, 95, 168, 0.72);
  stroke-width: 3;
}

.svg-node.is-pending .svg-node-shape {
  stroke: #c45c2d;
  stroke-width: 3;
}

.svg-connector-line {
  stroke: #4b4748;
  stroke-width: 4;
  stroke-linecap: round;
  transition: stroke 160ms ease;
}

.svg-connector-arrow {
  fill: #4b4748;
  transition: fill 160ms ease;
}

.svg-branch-label {
  fill: rgba(47, 36, 25, 0.82);
  font-family: "Space Grotesk", sans-serif;
  font-size: 16px;
}

.svg-if-line {
  fill: none;
  stroke: #4b4748;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.svg-merge-node {
  fill: #ece8e1;
  stroke: #7e7871;
  stroke-width: 3;
}

.svg-connector-hit {
  fill: transparent;
  cursor: pointer;
}

.svg-connector-hit-path {
  fill: none;
  stroke: transparent;
  stroke-width: 28;
  stroke-linecap: round;
  stroke-linejoin: round;
  cursor: pointer;
}

.svg-connector:hover .svg-connector-line,
.svg-connector:focus-visible .svg-connector-line,
.svg-connector:hover .svg-if-line,
.svg-connector:focus-visible .svg-if-line {
  stroke: var(--primary);
}

.svg-connector:hover .svg-connector-arrow,
.svg-connector:focus-visible .svg-connector-arrow {
  fill: var(--primary);
}

.flowchart-stack {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 52px;
}

.terminal-node {
  min-width: 146px;
  padding: 12px 28px;
  border-radius: 999px;
  border: 3px solid #9c78b2;
  background: linear-gradient(180deg, #ecdffa, #e1cff6);
  color: #23182a;
  font-family: "Space Grotesk", sans-serif;
  font-size: 1.15rem;
  font-weight: 500;
  text-align: center;
  box-shadow: 0 10px 24px rgba(156, 120, 178, 0.12);

.flowchart-node {
  min-width: 168px;
  min-height: 56px;
  padding: 12px 20px;
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Space Grotesk", sans-serif;
  font-size: 1rem;
  text-align: center;
  color: #2f2419;
  border: 2px solid transparent;
  background: white;
  cursor: pointer;
  appearance: none;
  transition: box-shadow 160ms ease, transform 160ms ease;
}

.flowchart-node:focus-visible {
  outline: 2px solid rgba(196, 92, 45, 0.28);
  outline-offset: 3px;
}

.flowchart-node.is-pending {
  box-shadow: 0 0 0 3px rgba(196, 92, 45, 0.18), 0 10px 24px rgba(74, 58, 43, 0.08);
  transform: translateY(-1px);
}

.flowchart-node.is-selected {
  filter: saturate(1.28) brightness(0.86) contrast(1.08);
  box-shadow: 0 0 0 4px rgba(29, 95, 168, 0.28), 0 12px 26px rgba(74, 58, 43, 0.14);
  transform: translateY(-1px);
}

.flowchart-node.is-executing {
  box-shadow: 0 0 0 4px rgba(196, 92, 45, 0.24), 0 12px 26px rgba(74, 58, 43, 0.14);
  transform: translateY(-1px);
}

.flowchart-node.is-preview-selected:not(.is-selected) {
  filter: saturate(1.16) brightness(0.93);
  box-shadow: 0 0 0 3px rgba(29, 95, 168, 0.18), 0 8px 18px rgba(74, 58, 43, 0.08);
  transform: translateY(-1px);
}

.invalid-variable {
  color: #b42318;
  font-weight: 700;
}


.flowchart-connector {

  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 0 6px;
  cursor: pointer;
  transition: transform 160ms ease;
}

.connector-line {
  width: 4px;
  height: 64px;
  border-radius: 999px;
  background: #4b4748;
  transition: background-color 160ms ease;
}

.connector-arrow {
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 12px solid #4b4748;
  margin-top: -1px;
  transition: border-top-color 160ms ease;
}

.flowchart-connector:hover,
.flowchart-connector:focus-visible {
  transform: scale(1.04);
  outline: none;
}

.flowchart-connector:hover .connector-line,
.flowchart-connector:focus-visible .connector-line {
  background: var(--primary);
}

.flowchart-connector:hover .connector-arrow,
.flowchart-connector:focus-visible .connector-arrow {
  border-top-color: var(--primary);
}

.flow-sequence {

  align-items: center;
}

.flow-structure {

  align-items: center;

  margin: 4px 0;
}

.branch-label,
.loop-entry-label,
.loop-exit-label {

  font-size: 0.9rem;

}

.if-reset-placeholder {

}

.if-reset-labels {

}

.if-reset-branches {

  gap: 72px;
  align-items: start;
}

.if-reset-branch {

  align-items: center;
}

.if-reset-sequence {

}

.loop-node-row {

}

}

.loop-exit-label {
  text-align: right;
}

.loop-body-layout,
.do-body-layout {
  position: relative;
  display: grid;
  grid-template-columns: 32px auto;
  gap: 28px;
  align-items: start;
  min-width: 340px;
}

.loop-main-rail,
.do-main-rail {
  width: 4px;
  justify-self: center;
  align-self: stretch;
  background: #4b4748;
  border-radius: 999px;
  min-height: 96px;
}

.loop-branch-shell,
.do-branch-shell {

  padding-top: 4px;
  padding-left: 34px;
}

.loop-branch-shell::before,
.do-branch-shell::before {
  content: "";
  position: absolute;
  top: 26px;
  left: 0;
  width: 34px;
  border-top: 3px solid #4b4748;
}

.loop-branch-shell::after {
  content: "";
  position: absolute;
  left: 14px;
  right: calc(100% - 18px);
  bottom: 38px;
  height: calc(100% - 64px);
  border-left: 3px solid #4b4748;
  border-bottom: 3px solid #4b4748;
}

.do-body-layout {
  grid-template-columns: 32px auto;
  margin-bottom: -6px;
}

.do-main-rail {

}

.do-branch-shell::after {
  content: "";
  position: absolute;
  top: 38px;
  left: 14px;
  bottom: 0;
  width: calc(100% - 14px);
  border-left: 3px solid #4b4748;
  border-bottom: 3px solid #4b4748;
}

.loop-node-row-do {

}

.shape-input,
.shape-output,
.shape-if,
.shape-loop,
.flow-node-input,
.flow-node-output,
.flow-node-if,
.flow-node-while,
.flow-node-for,
.flow-node-do {
  position: relative;
  isolation: isolate;
  border-color: transparent;
  background: var(--shape-border, rgba(74, 58, 43, 0.4));
}

.shape-input::after,
.shape-output::after,
.shape-if::after,
.shape-loop::after,
.flow-node-input::after,
.flow-node-output::after,
.flow-node-if::after,
.flow-node-while::after,
.flow-node-for::after,
.flow-node-do::after {
  content: "";
  position: absolute;
  inset: 1px;
  z-index: -1;
  background: var(--shape-fill, white);
  clip-path: var(--shape-inner-clip, inherit);
}

.shape-input,
.shape-output {
  --shape-inner-clip: polygon(13% 1px, calc(100% - 1px) 1px, 87% calc(100% - 1px), 1px calc(100% - 1px));
  clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%);
}

.shape-input {
  --shape-border: #7c9cbe;
  --shape-fill: #cfe4fb;
  border-color: #7c9cbe;
}

.shape-output {
  --shape-border: #8fb88f;
  --shape-fill: #daf8d8;
  border-color: #8fb88f;
}

.shape-declare,
.shape-assign {
  border-color: #c1b77d;
}

.shape-declare {
  background: #dff4ee;
  border-color: #7ba79a;
  box-shadow: inset 10px 0 0 rgba(123, 167, 154, 0.18), inset 20px 0 0 rgba(123, 167, 154, 0.1);
}

.shape-assign {
  background: #fbf8c9;
}

.shape-call {
  background: #e3d0f5;
  border-color: #9f82bc;
  box-shadow: inset 10px 0 0 rgba(159, 130, 188, 0.18), inset -10px 0 0 rgba(159, 130, 188, 0.18);

.shape-if {
  --shape-inner-clip: polygon(13% 1px, 87% 1px, calc(100% - 1px) 50%, 87% calc(100% - 1px), 13% calc(100% - 1px), 1px 50%);
  --shape-border: #c48d97;
  --shape-fill: #ffd8dd;
  border-color: #c48d97;
  clip-path: polygon(14% 0, 86% 0, 100% 50%, 86% 100%, 14% 100%, 0 50%);
}

.shape-loop {
  --shape-inner-clip: polygon(13% 1px, 87% 1px, calc(100% - 1px) 50%, 87% calc(100% - 1px), 13% calc(100% - 1px), 1px 50%);
  --shape-border: #c39a59;
  --shape-fill: #ffe3b4;
  border-color: #c39a59;
  clip-path: polygon(14% 0, 86% 0, 100% 50%, 86% 100%, 14% 100%, 0 50%);
}

.flow-node-input,
.flow-node-output {
  --shape-inner-clip: polygon(13% 1px, calc(100% - 1px) 1px, 87% calc(100% - 1px), 1px calc(100% - 1px));
  clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%);
}

.flow-node-input {
  --shape-border: #6f6f6f;
  --shape-fill: #d9d9d9;
  border-color: #6f6f6f;
}

.flow-node-output {
  --shape-border: #8fb88f;
  --shape-fill: #daf8d8;
  border-color: #8fb88f;
}

.flow-node-declare,
.flow-node-assign {
  border-color: #c1b77d;
}

.flow-node-declare {
  background: #dff4ee;
  border-color: #7ba79a;
  box-shadow: inset 10px 0 0 rgba(123, 167, 154, 0.18), inset 20px 0 0 rgba(123, 167, 154, 0.1);
}

.flow-node-assign {
  background: #fbf8c9;
}

.flow-node-call {
  background: #e3d0f5;
  border-color: #9f82bc;
  box-shadow: inset 10px 0 0 rgba(159, 130, 188, 0.18), inset -10px 0 0 rgba(159, 130, 188, 0.18);
}

.flow-node-if {
  min-width: 148px;
  --shape-inner-clip: polygon(50% 1px, calc(100% - 1px) 50%, 50% calc(100% - 1px), 1px 50%);
  --shape-border: #c48d97;
  --shape-fill: #ffd8dd;
  border-color: #c48d97;
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
}

.flow-node-while,
.flow-node-for,
.flow-node-do {
  --shape-inner-clip: polygon(13% 1px, 87% 1px, calc(100% - 1px) 50%, 87% calc(100% - 1px), 13% calc(100% - 1px), 1px 50%);
  --shape-border: #c39a59;
  --shape-fill: #ffe3b4;
  border-color: #c39a59;
  clip-path: polygon(14% 0, 86% 0, 100% 50%, 86% 100%, 14% 100%, 0 50%);
}

.flow-node-comment {
  min-width: 220px;
  min-height: 42px;
  padding: 10px 14px;
  border-style: dashed;
  border-color: #7a7a7a;
  background: rgba(255, 255, 255, 0.72);
  text-align: left;
  justify-content: center;
  align-items: flex-start;
}

.flow-node-comment .node-label-content,
.flow-node-comment .invalid-variable {
  width: 100%;
  text-align: left;
}

.flow-node-comment .node-label-content {
  display: block;
}

.info-card p,
.console-line p {
  margin-top: 8px;
  color: var(--muted);
  line-height: 1.5;
}

.code-canvas {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-height: 0;
  padding-top: 6px;
}

.code-card,
.code-preview {
  background: var(--panel-strong);
  border: 1px solid var(--surface-border);
  border-radius: 20px;
}

.code-card {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin: 0;
}

.code-card h3 {
  font-size: 1rem;
  line-height: 1.2;
}

.code-preview {
  margin: 0;
  padding: 18px 20px;
  flex: 1;
  min-height: 0;
  overflow: auto;
  color: var(--text);
  background:
    linear-gradient(180deg, rgba(255, 250, 242, 0.98), rgba(244, 233, 219, 0.98));
  font-family: "Space Grotesk", sans-serif;
  font-size: 1rem;
  line-height: 1.8;
  white-space: pre-wrap;
}

.code-line {
  display: block;
  margin: 0 -8px;
  padding: 0 8px;
  border-radius: 8px;
  transition: background-color 140ms ease, box-shadow 140ms ease;
}

.code-line.is-executing {
  background: rgba(196, 92, 45, 0.14);
  box-shadow: inset 3px 0 0 rgba(196, 92, 45, 0.92);
}

.language-tab {
  border: 1px solid var(--control-border);
  border-radius: 999px;
  background: var(--control-bg);
  color: var(--muted);
  padding: 0.55rem 0.95rem;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(74, 58, 43, 0.06);
  transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
}

.language-tab:hover {
  transform: translateY(-1px);
  background: var(--control-bg-hover);
  border-color: rgba(74, 58, 43, 0.42);
  color: var(--text);
  box-shadow: 0 8px 18px rgba(74, 58, 43, 0.12);
}

.language-tab.is-active {
  background: var(--secondary);
  color: #f7f3ec;
  border-color: rgba(19, 62, 61, 0.5);
}

.sidebar-panel {
  padding: 14px;
}

.mobile-sidebar-tabs {
  display: none;
  align-items: flex-end;
  gap: 4px;
  position: relative;
}

.mobile-sidebar-tab {
  position: relative;
  z-index: 1;
  min-width: 0;
  border: 1px solid rgba(74, 58, 43, 0.18);
  border-bottom: 0;
  border-radius: 14px 14px 0 0;
  background: linear-gradient(180deg, rgba(239, 225, 207, 0.98), rgba(222, 204, 180, 0.98));
  color: var(--muted);
  padding: 0.55rem 0.85rem 0.5rem;
  cursor: pointer;
  transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
}

.mobile-sidebar-tab::before {
  content: "";
  position: absolute;
  top: -8px;
  left: 14px;
  width: 34px;
  height: 12px;
  border-radius: 8px 8px 0 0;
  background: inherit;
  border: 1px solid rgba(74, 58, 43, 0.18);
  border-bottom: 0;
}

.mobile-sidebar-tab.is-active {
  background: linear-gradient(180deg, rgba(255, 250, 242, 1), rgba(250, 239, 225, 1));
  color: var(--text);
  border-color: rgba(74, 58, 43, 0.28);
  box-shadow: 0 -6px 14px rgba(74, 58, 43, 0.08);
}

.mobile-sidebar-tab.is-active::before {
  border-color: var(--line);
}

.mobile-sidebar-tab.is-active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: rgba(250, 239, 225, 1);
}

.sidebar-content {
  display: grid;
  grid-template-rows: minmax(180px, var(--sidebar-top-size)) 16px minmax(160px, 1fr);
  gap: 0;
  flex: 1;
  min-height: 0;
}

.sidebar-section,
.variables-table,
.console-shell {
  background: var(--panel-strong);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
}

.sidebar-section {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.sidebar-resizer {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: row-resize;
  user-select: none;
  touch-action: none;
}

.sidebar-resizer::before {
  content: "";
  width: 100%;
  height: 1px;
  background: rgba(74, 58, 43, 0.2);
  position: absolute;
}

.sidebar-resizer-handle {
  position: relative;
  z-index: 1;
  width: 54px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(226, 207, 183, 0.98), rgba(196, 174, 146, 0.98));
  border: 1px solid rgba(74, 58, 43, 0.24);
  box-shadow: 0 2px 8px rgba(74, 58, 43, 0.12);
}

.sidebar-resizer.is-dragging .sidebar-resizer-handle,
.sidebar-resizer:hover .sidebar-resizer-handle {
  background: linear-gradient(180deg, rgba(196, 92, 45, 0.9), rgba(165, 74, 35, 0.92));
  border-color: transparent;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid rgba(74, 58, 43, 0.18);
}

.section-heading h3 {
  font-size: 0.95rem;
}

.variables-section {
  min-height: 0;
}

.terminal-section {
  min-height: 0;
}

.variables-table,
.console-shell {
  border: 0;
  border-radius: 0;
  background: transparent;
  padding: 8px 12px 12px;
  box-shadow: none;
}

.variables-table {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  min-height: 0;
  overflow: hidden;
}

.table-head,
.table-row {
  display: grid;
  grid-template-columns: 1fr 0.9fr 1fr;
  gap: 8px;
  padding: 6px 0;
}

.table-head {
  font-size: 0.76rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.table-row {
  border-top: 1px solid var(--line);
}

.variables-body {
  min-height: 0;
  overflow: auto;
}

.muted {
  color: var(--muted);
}

.console-shell {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
  min-height: 0;
}

.console-status {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 0.28rem 0.7rem;
  border-radius: 999px;
  background: rgba(31, 92, 91, 0.1);
  color: var(--secondary);
  font-size: 0.82rem;
  font-weight: 700;
  white-space: nowrap;
}

.console-status[data-tone="success"] {
  background: rgba(31, 92, 91, 0.12);
  color: #1f5c5b;
}

.console-status[data-tone="warning"] {
  background: rgba(191, 124, 17, 0.14);
  color: #8a5a06;
}

.console-status[data-tone="error"] {
  background: rgba(180, 35, 24, 0.12);
  color: #b42318;
}

.console-output {
  min-height: 0;
  max-height: 100%;
  overflow: auto;
  display: grid;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid rgba(74, 58, 43, 0.22);
  border-radius: 12px;
  background: rgba(255, 250, 242, 0.82);
  align-content: start;
}

.console-entry {
  display: flex;
}

.console-entry p {
  margin: 0;
  line-height: 1.35;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: min(85%, 420px);
  padding: 8px 10px;
  border-radius: 12px;
  background: rgba(239, 228, 213, 0.66);
  color: var(--text);
}

.console-entry.is-output {
  justify-content: flex-start;
}

.console-entry.is-input {
  justify-content: flex-end;
}

.console-entry.is-input p {
  background: rgba(31, 92, 91, 0.14);
  color: var(--secondary);
}

.console-entry.is-error p {
  background: rgba(180, 35, 24, 0.1);
  color: #b42318;
}

.console-empty {
  margin: 0;
  color: var(--muted);
}

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-group topbar-group-start" id="topbar-start-controls">
        <button type="button" class="ghost-button" id="new-diagram-button">Nuovo</button>
        <button type="button" class="ghost-button" id="load-diagram-button">Carica</button>
        <button type="button" class="ghost-button" id="save-diagram-button">Salva</button>
        <button type="button" class="ghost-button" id="theme-toggle-button" title="Tema scuro">Tema scuro</button>
        <button type="button" class="ghost-button touch-selection-override-button" id="touch-selection-override-button" title="Forza controlli touch">Touch UI</button>
      </div>
      <div class="topbar-brand">
        <div class="topbar-brand-text">
          <p class="eyebrow">Prototype</p>
          <h1>AlgoFlow</h1>
        </div>
        <button
          type="button"
          class="ghost-button mobile-topbar-menu-toggle"
          id="mobile-topbar-menu-toggle"
          aria-controls="topbar-start-controls"
          aria-expanded="false"
          aria-label="Apri menu azioni"
          hidden
        >
          ☰
        </button>
      </div>
      <div class="topbar-group topbar-group-end">
        <button type="button" class="ghost-button" id="step-program-button" title="P">Passo</button>
        <button type="button" class="primary-button" id="run-program-button" title="E">Esegui</button>
        <button type="button" class="ghost-button" id="stop-program-button" title="Esc" disabled>Stop</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel diagram-panel" aria-label="Area principale">
        <div class="folder-tabs">
          <div class="folder-tab-list" role="tablist" aria-label="Vista area principale">
            <button type="button" class="folder-tab is-active" data-main-target="diagram-view" role="tab" aria-selected="true">
              <span class="folder-tab-label">Diagramma</span>
            </button>
            <button type="button" class="folder-tab" data-main-target="code-view" role="tab" aria-selected="false">
              <span class="folder-tab-label">Codice</span>
            </button>
          </div>
          <div class="folder-tabs-actions">
            <div class="history-actions" aria-label="Cronologia modifiche">
              <button type="button" class="history-button" id="undo-button" title="Annulla (Ctrl+Z)" aria-label="Annulla" disabled>
                <span class="history-button-icon" aria-hidden="true">↶</span>
              </button>
              <button type="button" class="history-button" id="redo-button" title="Ripristina (Ctrl+Y)" aria-label="Ripristina" disabled>
                <span class="history-button-icon" aria-hidden="true">↷</span>
              </button>
            </div>
            <button type="button" class="ghost-button focus-toggle-button" id="focus-mode-button" title="F">Focus</button>
            <label class="topbar-toggle folder-toggle" for="show-node-type-toggle">
              <input type="checkbox" id="show-node-type-toggle">
              <span>Mostra nome nodo</span>
            </label>
          </div>
        </div>

        <div class="main-content">
          <section class="main-view is-active" id="diagram-view" role="tabpanel">
            <div class="diagram-canvas" id="diagram-canvas">
              <div class="flowchart-root" id="flowchart-root" aria-label="Diagramma iniziale"></div>
              <div class="selection-box" id="selection-box" hidden></div>
              <div class="mobile-selection-controls" id="mobile-selection-controls" aria-label="Strumenti selezione mobile" hidden>
                <button
                  type="button"
                  class="mobile-selection-button"
                  id="mobile-multi-select-toggle"
                  aria-pressed="false"
                >
                  Selezione multipla
                </button>
                <button
                  type="button"
                  class="mobile-selection-button mobile-selection-button-danger"
                  id="mobile-delete-selection-button"
                  disabled
                >
                  Elimina selezione
                </button>
              </div>
              <div class="canvas-grid" aria-hidden="true"></div>
            </div>

            <div class="insert-dialog-backdrop" id="insert-dialog-backdrop" hidden>
              <section class="insert-dialog" role="dialog" aria-modal="true" aria-labelledby="insert-dialog-title">
                <div class="insert-dialog-header">
                  <h3 id="insert-dialog-title">Inserisci istruzione</h3>
                  <button type="button" class="dialog-close" id="insert-dialog-close" aria-label="Chiudi finestra">&times;</button>
                </div>

                <div class="insert-dialog-notice" id="insert-dialog-notice" hidden>
                  <button type="button" class="insert-dialog-notice-close" id="insert-dialog-notice-close" aria-label="Chiudi messaggio">&times;</button>
                  <p class="insert-dialog-notice-text" id="insert-dialog-notice-text"></p>
                </div>

                <div class="insert-dialog-actions">
                  <button type="button" class="quick-action quick-action-paste">
                    <span class="quick-action-icon" aria-hidden="true">
                      <span class="icon-clipboard"></span>
                      <span class="icon-paper"></span>
                    </span>
                    <span class="quick-action-label">Incolla</span>
                  </button>

                  <button type="button" class="quick-action quick-action-comment" data-node-type="comment">
                    <span class="quick-action-icon icon-comment" aria-hidden="true"></span>
                    <span class="quick-action-label">Commento</span>
                  </button>
                </div>

                <div class="insert-dialog-grid">
                  <div class="insert-column">
                    <h4>Input / Output</h4>
                    <button type="button" class="insert-option shape-input" data-node-type="input">Input</button>
                    <button type="button" class="insert-option shape-output" data-node-type="output">Output</button>
                  </div>

                  <div class="insert-column">
                    <h4>Variables</h4>
                    <button type="button" class="insert-option shape-declare" data-node-type="declare">Declare</button>
                    <button type="button" class="insert-option shape-assign" data-node-type="assign">Assign</button>
                  </div>

                  <div class="insert-column">
                    <h4>Control</h4>
                    <button type="button" class="insert-option shape-if" data-node-type="if">If</button>
                    <button type="button" class="insert-option shape-call is-disabled" data-node-type="call" aria-disabled="true">Call</button>
                  </div>

                  <div class="insert-column">
                    <h4>Looping</h4>
                    <button type="button" class="insert-option shape-loop" data-node-type="while">While</button>
                    <button type="button" class="insert-option shape-loop" data-node-type="for">For</button>
                    <button type="button" class="insert-option shape-loop" data-node-type="do">Do-While</button>
                  </div>
                </div>
              </section>
            </div>

            <div class="property-dialog-backdrop" id="property-dialog-backdrop" hidden>
              <section class="property-dialog" role="dialog" aria-modal="true" aria-labelledby="property-dialog-title">
                <div class="property-dialog-header">
                  <h3 id="property-dialog-title">Proprietà</h3>
                  <button type="button" class="dialog-close" id="property-dialog-close" aria-label="Chiudi finestra">&times;</button>
                </div>

                <div class="property-dialog-hero">
                  <div class="property-preview" id="property-preview"></div>
                  <p class="property-description" id="property-description"></p>
                </div>

                <form class="property-form" id="property-form">
                  <div class="property-error" id="property-error" hidden>
                    <p class="property-error-text" id="property-error-text"></p>
                    <button type="button" class="property-error-close" id="property-error-close" aria-label="Chiudi messaggio">&times;</button>
                  </div>

                  <label class="property-field" id="generic-property-field">
                    <span id="property-field-label">Valore</span>
                    <textarea id="property-input" rows="1"></textarea>
                    <div class="assign-suggestions" id="assign-suggestions" hidden></div>
                  </label>

                  <div class="output-fields" id="output-fields" hidden>
                    <label class="property-field" for="output-quoted-text">
                      <span>Testo Output</span>
                    </label>

                    <div class="output-quoted-preview" id="output-quoted-preview" aria-hidden="false">
                      <div
                        class="output-quoted-text"
                        id="output-quoted-text"
                        contenteditable="true"
                        role="textbox"
                        aria-multiline="true"
                        aria-label="Testo output"
                      ></div>
                    </div>

                    <label class="checkbox-option">
                      <input type="checkbox" id="output-newline-input" checked>
                      <span>A capo dopo Output</span>
                    </label>
                  </div>

                  <div class="declare-fields" id="declare-fields" hidden>
                    <label class="property-field">
                      <span>Variable Names:</span>
                      <input type="text" id="declare-name-input" autocomplete="off">
                    </label>

                    <div class="declare-type-grid">
                      <fieldset class="declare-type-group">
                        <legend>Type:</legend>
                        <label class="radio-option">
                          <input type="radio" name="declare-type" value="Integer" checked>
                          <span>Integer</span>
                        </label>
                        <label class="radio-option">
                          <input type="radio" name="declare-type" value="Real">
                          <span>Real</span>
                        </label>
                        <label class="radio-option">
                          <input type="radio" name="declare-type" value="String">
                          <span>String</span>
                        </label>
                        <label class="radio-option">
                          <input type="radio" name="declare-type" value="Boolean">
                          <span>Boolean</span>
                        </label>
                      </fieldset>

                      <label class="checkbox-option" id="declare-array-option">
                        <input type="checkbox" id="declare-array-input">
                        <span>Array?</span>
                      </label>
                    </div>

                    <label class="property-field" id="declare-array-length-field" hidden>
                      <span>Array Length:</span>
                      <input type="number" id="declare-array-length-input" min="1" step="1" inputmode="numeric">
                    </label>
                  </div>

                  <div class="for-fields" id="for-fields" hidden>
                    <div class="for-fields-grid">
                      <label class="property-field">
                        <span>Variabile:</span>
                        <input type="text" id="for-variable-input" autocomplete="off">
                      </label>

                      <label class="property-field">
                        <span>Valore iniziale:</span>
                        <input type="text" id="for-start-input" autocomplete="off">
                      </label>

                      <label class="property-field">
                        <span>Valore finale:</span>
                        <input type="text" id="for-end-input" autocomplete="off">
                      </label>

                      <label class="property-field">
                        <span>Passo:</span>
                        <input type="text" id="for-step-input" autocomplete="off">
                      </label>
                    </div>

                    <label class="checkbox-option">
                      <input type="checkbox" id="for-include-end-input" checked>
                      <span>Includi valore finale (<= oppure >=)</span>
                    </label>
                  </div>

                  <div class="property-dialog-actions">
                    <button type="submit" class="property-button property-button-primary">OK</button>
                    <button type="button" class="property-button" id="property-dialog-cancel">Cancel</button>
                  </div>
                </form>
              </section>
            </div>
          </section>

          <section class="main-view" id="code-view" role="tabpanel" hidden>
            <div class="code-canvas">
              <div class="code-card">
                <h3>Vista codice</h3>
                <div class="language-tabs" role="tablist" aria-label="Selezione linguaggio">
                  <button type="button" class="language-tab is-active" data-code-language="c" aria-selected="true">C</button>
                  <button type="button" class="language-tab" data-code-language="cpp" aria-selected="false">C++</button>
                  <button type="button" class="language-tab" data-code-language="python" aria-selected="false">Python</button>
                </div>
              </div>
              <pre class="code-preview"><code id="code-preview-content"></code></pre>
            </div>
          </section>
        </div>
      </section>

      <div class="workspace-resizer" id="workspace-resizer" aria-hidden="true">
        <div class="workspace-resizer-handle"></div>
      </div>

      <aside class="panel sidebar-panel" aria-label="Pannello laterale">
        <div class="mobile-sidebar-tabs" role="tablist" aria-label="Vista pannello laterale">
          <button type="button" class="mobile-sidebar-tab is-active" data-sidebar-target="variables" aria-selected="true">Variabili</button>
          <button type="button" class="mobile-sidebar-tab" data-sidebar-target="terminal" aria-selected="false">Terminale</button>
        </div>
        <div class="sidebar-content">
          <section class="sidebar-section variables-section" aria-labelledby="variables-title">
            <div class="section-heading">
              <h3 id="variables-title">Variabili</h3>
            </div>
            <div class="variables-table">
              <div class="table-head">
                <span>Nome</span>
                <span>Tipo</span>
                <span>Valore</span>
              </div>
              <div class="variables-body" id="variables-body">
                <div class="table-row muted">
                  <span>Nessuna variabile</span>
                  <span>-</span>
                  <span>-</span>
                </div>
              </div>
            </div>
          </section>

          <div class="sidebar-resizer" id="sidebar-resizer" aria-hidden="true">
            <div class="sidebar-resizer-handle"></div>
          </div>

          <section class="sidebar-section terminal-section" aria-labelledby="terminal-title">
            <div class="section-heading">
              <h3 id="terminal-title">Terminale</h3>
              <span class="console-status" id="terminal-status">Pronto</span>
            </div>
            <div class="console-shell">
              <div class="console-output" id="console-output">
                <p class="console-empty">Nessun output</p>
              </div>
              <form class="console-input" id="console-input-form" hidden>
                <label for="console-input-field" id="console-input-label">Input utente</label>
                <div class="console-input-row">
                  <input type="text" id="console-input-field" autocomplete="off" placeholder="Scrivi qui...">
                  <button type="submit" class="console-submit-button" id="console-input-button">Invia</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </aside>
    </main>
  </div>

const hasFinePointerSupport = () =>
  Boolean(window.matchMedia && window.matchMedia("(any-pointer: fine)").matches);

const isPrimaryPointerCoarse = () =>
  Boolean(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);

const isTouchPrimaryLayout = () => {
  if (isPrimaryPointerCoarse()) {
    return true;
  }

  if (window.matchMedia && window.matchMedia("(any-pointer: coarse)").matches && !hasFinePointerSupport()) {
    return true;
  }

  return Number(navigator.maxTouchPoints || 0) > 0 && !hasFinePointerSupport();
};

  if (isTouchSelectionUiForced) {

  // Show controls on touch-first devices even at high resolution,

  if (isPrimaryPointerCoarse()) {
    return true;
  }

  return isCompactLayout() && isTouchPrimaryLayout();
};

const getVisibleTopbarItems = (container) => {
  if (!(container instanceof HTMLElement)) {
    return [];
  }

  return Array.from(container.children).filter((child) => {
    if (!(child instanceof HTMLElement)) {
      return false;
    }

    if (child.hidden) {
      return false;
    }

    const style = window.getComputedStyle(child);
    return style.display !== "none" && style.visibility !== "hidden";
  });
};

const hasWrappedTopbarItems = (container) => {
  const items = getVisibleTopbarItems(container);

  if (items.length < 2) {
    return false;
  }

  const firstTop = items[0].offsetTop;
  return items.some((item) => Math.abs(item.offsetTop - firstTop) > 2);
};

const areTopbarGroupsOverlapping = (startGroup, endGroup) => {
  if (!(startGroup instanceof HTMLElement) || !(endGroup instanceof HTMLElement)) {
    return false;
  }

  const startRect = startGroup.getBoundingClientRect();
  const endRect = endGroup.getBoundingClientRect();
  const horizontalOverlap = startRect.right > endRect.left + 2;
  const verticalOverlap = startRect.bottom > endRect.top + 2 && endRect.bottom > startRect.top + 2;

  return horizontalOverlap && verticalOverlap;
};

const syncTopbarAdaptiveLayout = () => {

  appShell.classList.remove("is-topbar-start-overflow");

  const startWrapped = hasWrappedTopbarItems(topbarStartControls);
  const endWrapped = hasWrappedTopbarItems(topbarEndControls);
  const overlappingGroups = areTopbarGroupsOverlapping(topbarStartControls, topbarEndControls);

  if (startWrapped || endWrapped || overlappingGroups) {

const applyDiagramZoom = () => {
  if (!flowchartRoot) {
    return;
  }

  const diagramSvg = flowchartRoot.querySelector(".diagram-svg");
  const baseWidth = Number(flowchartRoot.dataset.baseWidth || "0");

  if (!(diagramSvg instanceof SVGElement)) {
    return;
  }

  if (baseWidth > 0) {
    const scaledWidth = Math.round(baseWidth * diagramZoom);
    diagramSvg.style.width = `${scaledWidth}px`;
    flowchartRoot.style.minWidth = `${scaledWidth}px`;
    return;
  }

  diagramSvg.style.width = `${diagramZoom * 100}%`;
};

const setDiagramZoom = (nextZoom) => {
  const normalizedZoom = Math.min(
    MAX_DIAGRAM_ZOOM,
    Math.max(MIN_DIAGRAM_ZOOM, Number(nextZoom.toFixed(2)))
  );

  if (normalizedZoom === diagramZoom) {
    return;
  }

  diagramZoom = normalizedZoom;
  applyDiagramZoom();
};

const getCurrentDiagramZoomPreset = () => {
  if (window.innerWidth <= 630) {
    return "phone";
  }

  if (window.innerWidth <= COMPACT_LAYOUT_BREAKPOINT) {
    return "compact";
  }

  return "desktop";
};

const syncResponsiveDiagramZoom = (options = {}) => {
  const { force = false } = options;
  const nextPreset = getCurrentDiagramZoomPreset();

  if (!force && currentDiagramZoomPreset === nextPreset) {
    return;
  }

  currentDiagramZoomPreset = nextPreset;
  diagramZoom = DIAGRAM_ZOOM_PRESETS[nextPreset] ?? 1;
  applyDiagramZoom();
};

const getStructuredBranchKeys = (type) => {
  switch (type) {
    case "if":
      return ["falseBranch", "trueBranch"];
    case "while":
    case "for":
    case "do":
      return ["body"];
    default:
      return [];
  }
};

const createStructuredBranches = (type) => {
  const branchKeys = getStructuredBranchKeys(type);

  if (branchKeys.length === 0) {
    return undefined;
  }

  return Object.fromEntries(branchKeys.map((key) => [key, []]));
};

const isStructuredNode = (node) => Boolean(node && getStructuredBranchKeys(node.type).length);

const traverseNodes = (nodes, callback, path = []) => {
  nodes.forEach((node, index) => {
    callback(node, { index, path, nodes });

    if (!isStructuredNode(node) || !node.branches) {
      return;
    }

    getStructuredBranchKeys(node.type).forEach((branchKey) => {
      traverseNodes(node.branches[branchKey] ?? [], callback, [...path, { nodeId: node.id, branchKey }]);
    });
  });
};

const findNodeById = (nodeId) => {
  let match = null;

  traverseNodes(flowNodes, (node) => {
    if (node.id === nodeId) {
      match = node;
    }
  });

  return match;
};

const getContainerByPath = (path) => {
  let container = flowNodes;

  for (const segment of path) {
    const parentNode = findNodeById(segment.nodeId);

    if (!parentNode?.branches?.[segment.branchKey]) {
      return flowNodes;
    }

    container = parentNode.branches[segment.branchKey];
  }

  return container;
};

const findNodeLocationById = (nodeId) => {
  let location = null;

  traverseNodes(flowNodes, (node, context) => {
    if (node.id === nodeId) {
      location = {
        node,
        index: context.index,
        path: context.path,
        container: context.nodes,
      };
    }
  });

  return location;
};

const removeNodeById = (nodeId) => {
  const location = findNodeLocationById(nodeId);

  if (!location) {
    return false;
  }

  location.container.splice(location.index, 1);
  return true;
};

const areNodePathsEqual = (leftPath, rightPath) => {
  if (leftPath.length !== rightPath.length) {
    return false;
  }

  return leftPath.every((segment, index) =>
    segment.nodeId === rightPath[index]?.nodeId && segment.branchKey === rightPath[index]?.branchKey
  );
};

const isAncestorNodeSelected = (nodeId) => {
  const location = findNodeLocationById(nodeId);

  if (!location) {
    return false;
  }

  return location.path.some((segment) => selectedNodeIds.has(segment.nodeId));
};

const getClipboardSelectionContext = () => {
  if (selectedNodeIds.size === 0) {
    return { error: "Seleziona almeno un nodo." };
  }

  const selectedLocations = Array.from(selectedNodeIds)
    .filter((nodeId) => !isAncestorNodeSelected(nodeId))
    .map((nodeId) => findNodeLocationById(nodeId))
    .filter(Boolean);

  if (selectedLocations.length === 0) {
    return { error: "La selezione corrente non contiene nodi copiabili." };
  }

  const [firstLocation] = selectedLocations;
  const hasMixedContainers = selectedLocations.some((location) => !areNodePathsEqual(location.path, firstLocation.path));

  if (hasMixedContainers) {
    return { error: "Per copia, taglia e incolla seleziona nodi appartenenti allo stesso blocco o ramo." };
  }

  selectedLocations.sort((left, right) => left.index - right.index);

  return {
    path: firstLocation.path,
    container: firstLocation.container,
    locations: selectedLocations,
    nodes: selectedLocations.map((location) => location.node),
  };
};

const serializeNode = (node) => {
  const serializedNode = {
    id: node.id,
    type: node.type,
    value: node.value,
  };

  if (node.declareConfig) {
    serializedNode.declareConfig = {
      names: [...(node.declareConfig.names ?? [])],
      dataType: node.declareConfig.dataType,
      isArray: node.declareConfig.isArray,
      arrayLength: Number.isInteger(node.declareConfig.arrayLength) ? node.declareConfig.arrayLength : null,
    };
  }

  if (node.forConfig) {
    serializedNode.forConfig = {
      variable: node.forConfig.variable,
      start: node.forConfig.start,
      end: node.forConfig.end,
      step: node.forConfig.step,
      includeEnd: node.forConfig.includeEnd !== false,
    };
  }

  if (node.outputConfig) {
    serializedNode.outputConfig = {
      appendNewline: node.outputConfig.appendNewline !== false,
    };
  }

  if (isStructuredNode(node)) {
    serializedNode.branches = {};

    getStructuredBranchKeys(node.type).forEach((branchKey) => {
      serializedNode.branches[branchKey] = (node.branches?.[branchKey] ?? [])
        .filter((childNode) => !childNode.isDraft)
        .map(serializeNode);
    });
  }

  return serializedNode;
};

const getPersistedFlowNodes = () =>
  flowNodes

const normalizeNode = (rawNode) => {
  if (
    !rawNode ||
    typeof rawNode.id !== "number" ||
    typeof rawNode.type !== "string" ||
    !Object.hasOwn(nodeDefinitions, rawNode.type) ||
    typeof rawNode.value !== "string"
  ) {
    return null;
  }

  const normalizedNode = {
    id: rawNode.id,
    type: rawNode.type,
    value: rawNode.value,
    isDraft: false,
  };

  if (rawNode.type === "declare") {
    normalizedNode.declareConfig = rawNode.declareConfig
      ? {
          names: Array.isArray(rawNode.declareConfig.names)
            ? rawNode.declareConfig.names.filter((name) => typeof name === "string")
            : typeof rawNode.declareConfig.name === "string"
              ? rawNode.declareConfig.name.split(",").map((name) => name.trim()).filter(Boolean)
              : [],
          dataType: typeof rawNode.declareConfig.dataType === "string" ? rawNode.declareConfig.dataType : "Integer",
          isArray: Boolean(rawNode.declareConfig.isArray),
          arrayLength: Number.isInteger(rawNode.declareConfig.arrayLength) && rawNode.declareConfig.arrayLength > 0
            ? rawNode.declareConfig.arrayLength
            : null,
        }
      : {
          names: [],
          dataType: "Integer",
          isArray: false,
          arrayLength: null,
        };
  }

  if (rawNode.type === "for") {
    normalizedNode.forConfig = rawNode.forConfig
      ? {
          variable: typeof rawNode.forConfig.variable === "string" ? rawNode.forConfig.variable : "",
          start: typeof rawNode.forConfig.start === "string" ? rawNode.forConfig.start : "",
          end: typeof rawNode.forConfig.end === "string" ? rawNode.forConfig.end : "",
          step: typeof rawNode.forConfig.step === "string" ? rawNode.forConfig.step : "",
          includeEnd: rawNode.forConfig.includeEnd !== false,
        }
      : {
          variable: "",
          start: "",
          end: "",
          step: "",
          includeEnd: true,
        };
  }

  if (rawNode.type === "output") {
    normalizedNode.outputConfig = rawNode.outputConfig
      ? {
          appendNewline: rawNode.outputConfig.appendNewline !== false,
        }
      : {
          appendNewline: true,
        };
  }

  if (getStructuredBranchKeys(rawNode.type).length > 0) {
    normalizedNode.branches = createStructuredBranches(rawNode.type);

    getStructuredBranchKeys(rawNode.type).forEach((branchKey) => {
      const rawBranch = rawNode.branches?.[branchKey];
      normalizedNode.branches[branchKey] = Array.isArray(rawBranch)
        ? rawBranch.map(normalizeNode).filter(Boolean)
        : [];
    });
  }

  return normalizedNode;
};

const cloneNodeForClipboard = (node) => {

const assignFreshNodeIds = (nodes) => {
  const assignIds = (nodeList) => {
    nodeList.forEach((node) => {
      node.id = nextNodeId;
      nextNodeId += 1;

      if (node.branches) {
        Object.values(node.branches).forEach((branchNodes) => assignIds(branchNodes));
      }
    });
  };

  assignIds(nodes);
  return nodes;
};

const escapeRegExp = (text) => text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

const replaceIdentifierInExpression = (text, fromName, toName) => {
  if (!text || fromName === toName) {
    return text;
  }

  const pattern = new RegExp(`\\b${escapeRegExp(fromName)}\\b`, "g");
  return text.replace(pattern, toName);
};

const renameIdentifierInOutputTemplate = (text, fromName, toName) => {
  if (!text || fromName === toName) {
    return text;
  }

  return String(text).replace(/\{([^{}]+)\}/g, (placeholder, expression) => {
    const nextExpression = replaceIdentifierInExpression(expression, fromName, toName);
    return `{${nextExpression}}`;
  });
};

const renameIdentifierAcrossNodes = (nodes, fromName, toName) => {
  traverseNodes(nodes, (node) => {
    if (node.type === "declare" && node.declareConfig?.names) {
      node.declareConfig.names = node.declareConfig.names.map((name) => (name === fromName ? toName : name));
      return;
    }

    if (node.type === "assign") {
      const parsedAssignment = parseAssignmentStatement(node.value);

      if (parsedAssignment) {
        const variableName = parsedAssignment.variableName === fromName ? toName : parsedAssignment.variableName;
        const indexExpression = parsedAssignment.indexExpression
          ? replaceIdentifierInExpression(parsedAssignment.indexExpression, fromName, toName)
          : null;
        const expression = replaceIdentifierInExpression(parsedAssignment.expression, fromName, toName);
        const targetText = indexExpression ? `${variableName}[${indexExpression}]` : variableName;
        node.value = `${targetText} ${parsedAssignment.operator} ${expression}`.trim();
      }
      return;
    }

    if (node.type === "input") {
      node.value = node.value.trim() === fromName ? toName : node.value;
      return;
    }

    if (node.type === "output") {
      node.value = outputPlaceholderPattern.test(String(node.value ?? ""))
        ? renameIdentifierInOutputTemplate(node.value, fromName, toName)
        : replaceIdentifierInExpression(node.value, fromName, toName);
      return;
    }

    if (node.type === "if" || node.type === "while" || node.type === "do") {
      node.value = replaceIdentifierInExpression(node.value, fromName, toName);
      return;
    }

    if (node.type === "for") {
      if (node.forConfig) {
        node.forConfig.variable = node.forConfig.variable === fromName ? toName : node.forConfig.variable;
        node.forConfig.start = replaceIdentifierInExpression(node.forConfig.start, fromName, toName);
        node.forConfig.end = replaceIdentifierInExpression(node.forConfig.end, fromName, toName);
        node.forConfig.step = replaceIdentifierInExpression(node.forConfig.step, fromName, toName);
        const { variable, start, end, step, includeEnd } = node.forConfig;
        node.value = buildForDisplayText({ variable, start, end, step, includeEnd });
      } else {
        node.value = replaceIdentifierInExpression(node.value, fromName, toName);
      }
    }
  });
};

const getUniqueDeclaredName = (baseName, unavailableNames) => {
  let suffix = 2;
  let candidate = `${baseName}${suffix}`;

  while (unavailableNames.has(candidate) || reservedLanguageNames.has(candidate) || reservedLanguageNames.has(candidate.toLowerCase())) {
    suffix += 1;
    candidate = `${baseName}${suffix}`;
  }

  return candidate;
};

const resolveClipboardDeclarationConflicts = (nodes) => {
  const unavailableNames = getDeclaredVariableNameSet();
  const renamedDeclarations = [];

  traverseNodes(nodes, (node) => {
    if (node.type !== "declare" || !node.declareConfig?.names) {
      return;
    }

    node.declareConfig.names = node.declareConfig.names.map((name) => {
      if (!unavailableNames.has(name)) {
        unavailableNames.add(name);
        return name;
      }

      const nextName = getUniqueDeclaredName(name, unavailableNames);
      unavailableNames.add(nextName);
      renamedDeclarations.push({ from: name, to: nextName });
      return nextName;
    });
  });

  renamedDeclarations.forEach(({ from, to }) => {
    renameIdentifierAcrossNodes(nodes, from, to);
  });

  return renamedDeclarations;
};

const getPasteTargetContext = () => {
  if (selectedNodeIds.size > 0) {
    const selectionContext = getClipboardSelectionContext();

    if (selectionContext.error) {
      return { error: selectionContext.error };
    }

    const lastLocation = selectionContext.locations[selectionContext.locations.length - 1];
    return {
      path: selectionContext.path,
      container: selectionContext.container,
      index: lastLocation.index + 1,
    };
  }

  return {
    path: [],
    container: flowNodes,
    index: flowNodes.length,
  };
};

const applyPersistedFlowNodes = (rawNodes, options = {}) => {
  const { resetHistory = true } = options;

  if (!Array.isArray(rawNodes)) {
    throw new Error("Il file non contiene un elenco di nodi valido.");
  }

  const validNodes = rawNodes.map(normalizeNode).filter(Boolean);

  flowNodes.length = 0;
  flowNodes.push(...validNodes);

  let maxId = 0;
  traverseNodes(flowNodes, (node) => {
    maxId = Math.max(maxId, node.id);
  });

  nextNodeId = maxId + 1;
  pendingInsertTarget = null;
  editingNodeId = null;
  lastConnectorButton = null;
  selectedNodeIds = new Set();
  previewSelectedNodeIds = new Set();
  if (resetHistory) {
    undoHistory = [];
    redoHistory = [];
  }
  clearRuntimeSnapshot();
};

      resolve(null);
      return;
    }

    const request = window.indexedDB.open(ALGOFLOW_PICKER_DB_NAME, 1);

    request.addEventListener("upgradeneeded", () => {
      const database = request.result;

      if (!database.objectStoreNames.contains(ALGOFLOW_PICKER_STORE_NAME)) {
        database.createObjectStore(ALGOFLOW_PICKER_STORE_NAME);
      }
    });

    request.addEventListener("success", () => {
      resolve(request.result);
    });

    request.addEventListener("error", () => {
      reject(request.error ?? new Error("Impossibile aprire il database dei file picker."));
    });
  });

const loadLastAlgoFlowPickerHandle = async () => {
  const database = await openAlgoFlowPickerDatabase();

  if (!database) {
    return null;
  }

  return new Promise((resolve, reject) => {
    const transaction = database.transaction(ALGOFLOW_PICKER_STORE_NAME, "readonly");
    const store = transaction.objectStore(ALGOFLOW_PICKER_STORE_NAME);
    const request = store.get(ALGOFLOW_PICKER_HANDLE_KEY);

    request.addEventListener("success", () => {
      resolve(request.result ?? null);
      database.close();
    });

    request.addEventListener("error", () => {
      database.close();
      reject(request.error ?? new Error("Impossibile leggere l'ultima posizione usata."));
    });
  });
};

const saveLastAlgoFlowPickerHandle = async (handle) => {
  if (!handle) {
    return;
  }

  const database = await openAlgoFlowPickerDatabase();

  if (!database) {
    return;
  }

  return new Promise((resolve, reject) => {
    const transaction = database.transaction(ALGOFLOW_PICKER_STORE_NAME, "readwrite");
    const store = transaction.objectStore(ALGOFLOW_PICKER_STORE_NAME);
    const request = store.put(handle, ALGOFLOW_PICKER_HANDLE_KEY);

    request.addEventListener("success", () => {
      resolve();
    });

    request.addEventListener("error", () => {
      reject(request.error ?? new Error("Impossibile salvare l'ultima posizione usata."));
    });

    transaction.addEventListener("complete", () => {
      database.close();
    });

    transaction.addEventListener("error", () => {
      database.close();
    });

    transaction.addEventListener("abort", () => {
      database.close();
    });
  });
};

const uint8ArrayToBase64 = (bytes) => {
  let binary = "";

  for (let index = 0; index < bytes.length; index += 0x8000) {
    const chunk = bytes.subarray(index, index + 0x8000);
    binary += String.fromCharCode(...chunk);
  }

  return window.btoa(binary);
};

const base64ToUint8Array = (encodedValue) => {
  const binary = window.atob(encodedValue);
  const bytes = new Uint8Array(binary.length);

  for (let index = 0; index < binary.length; index += 1) {
    bytes[index] = binary.charCodeAt(index);
  }

  return bytes;
};

const concatUint8Arrays = (chunks) => {
  const totalLength = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
  const result = new Uint8Array(totalLength);
  let offset = 0;

  chunks.forEach((chunk) => {
    result.set(chunk, offset);
    offset += chunk.length;
  });

  return result;
};

const formatPdfNumber = (value) => {
  if (!Number.isFinite(value)) {
    return "0";
  }

  const roundedValue = Math.abs(value) < 0.0001 ? 0 : value;
  return roundedValue.toFixed(2).replace(/\.?0+$/, "");
};

const escapePdfLiteralString = (value) =>
  String(value)
    .replace(/\\/g, "\\\\")
    .replace(/\(/g, "\\(")
    .replace(/\)/g, "\\)");

const encodePdfAscii = (value) => new TextEncoder().encode(value);

const dataUrlToUint8Array = (dataUrl) => {
  const [, encodedPayload = ""] = String(dataUrl).split(",", 2);
  return base64ToUint8Array(encodedPayload);
};

const findByteSequence = (sourceBytes, patternBytes, fromIndex = 0) => {
  if (!patternBytes.length || sourceBytes.length < patternBytes.length) {
    return -1;
  }

  for (let index = fromIndex; index <= sourceBytes.length - patternBytes.length; index += 1) {
    let matches = true;

    for (let patternIndex = 0; patternIndex < patternBytes.length; patternIndex += 1) {
      if (sourceBytes[index + patternIndex] !== patternBytes[patternIndex]) {
        matches = false;
        break;
      }
    }

    if (matches) {
      return index;
    }
  }

  return -1;
};

const extractEmbeddedAlgoFlowJsonFromPdfBytes = (pdfBytes) => {
  const beginMarker = encodePdfAscii(`% ${ALGOFLOW_PDF_PAYLOAD_BEGIN}`);
  const endMarker = encodePdfAscii(`% ${ALGOFLOW_PDF_PAYLOAD_END}`);
  const payloadStart = findByteSequence(pdfBytes, beginMarker);

  if (payloadStart < 0) {
    throw new Error("Il PDF non contiene alcun diagramma AlgoFlow incorporato.");
  }

  const payloadEnd = findByteSequence(pdfBytes, endMarker, payloadStart + beginMarker.length);

  if (payloadEnd < 0) {
    throw new Error("Il PDF contiene dati AlgoFlow incompleti.");
  }

  const payloadBytes = pdfBytes.slice(payloadStart + beginMarker.length, payloadEnd);
  const payloadText = new TextDecoder("utf-8").decode(payloadBytes);
  const encodedPayload = payloadText
    .split(/\r?\n/)
    .map((line) => line.replace(/^%\s?/, "").trim())
    .filter(Boolean)
    .join("");

  if (!encodedPayload) {
    throw new Error("Il PDF non contiene dati AlgoFlow leggibili.");
  }

  try {
    const jsonBytes = base64ToUint8Array(encodedPayload);
    return new TextDecoder().decode(jsonBytes);
  } catch {
    throw new Error("I dati AlgoFlow incorporati nel PDF non sono validi.");
  }
};

};

const getFlowgorithmSavedTimestamp = () => {

  ].join("-");
  let hours = now.getHours();

  const meridiem = hours >= 12 ? "PM" : "AM";
  hours = hours % 12 || 12;
  return `${datePart} ${String(hours).padStart(2, "0")}:${minutes}:${seconds} ${meridiem}`;
};

const escapeFlowgorithmStringLiteral = (value) =>
  String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/"/g, '\\"')
    .replace(/\r?\n/g, "\\n");

const formatTemplateAsFlowgorithmOutputExpression = (template) => {
  const parts = [];
  const placeholderPattern = /\{([A-Za-z_][A-Za-z0-9_]*)\}/g;
  let lastIndex = 0;
  let match = null;

  while ((match = placeholderPattern.exec(String(template ?? ""))) !== null) {
    const literalText = String(template ?? "").slice(lastIndex, match.index);

    if (literalText) {
      parts.push(`"${escapeFlowgorithmStringLiteral(literalText)}"`);
    }

    parts.push(match[1]);
    lastIndex = match.index + match[0].length;
  }

  const trailingText = String(template ?? "").slice(lastIndex);

  if (trailingText || parts.length === 0) {
    parts.push(`"${escapeFlowgorithmStringLiteral(trailingText)}"`);
  }

  return parts.join(" & ");
};

const convertAssignmentToFlowgorithm = (node) => {
  const parsedAssignment = parseAssignmentStatement(node.value);

  if (!parsedAssignment) {
    throw new Error(`Il nodo Assign ${node.id} non può essere esportato in Flowgorithm.`);
  }

  if (parsedAssignment.operator === "=") {
    return {
      ...parsedAssignment,
      variableName: parsedAssignment.targetText,
    };
  }

  const operatorMap = {
    "+=": "+",
    "-=": "-",
    "*=": "*",
    "/=": "/",
    "%=": "%",
  };

  const mappedOperator = operatorMap[parsedAssignment.operator];

  return {
    variableName: parsedAssignment.targetText,
    operator: "=",
    expression: `${parsedAssignment.targetText} ${mappedOperator} (${parsedAssignment.expression})`,
  };
};

const exportNodesToFlowgorithmXml = (nodes, indentLevel = 5) => {
  const indent = CODEGEN_INDENT.repeat(indentLevel);
  const lines = [];

  nodes.forEach((node) => {
    switch (node.type) {
      case "declare": {
        const names = (node.declareConfig?.names ?? []).join(", ");
        const dataType = node.declareConfig?.dataType ?? "Integer";
        const isArray = Boolean(node.declareConfig?.isArray);
        const arrayLength = Number.isInteger(node.declareConfig?.arrayLength) ? node.declareConfig.arrayLength : null;

        lines.push(
          `${indent}<declare name="${escapeXmlAttribute(names)}" type="${escapeXmlAttribute(dataType)}" array="${isArray ? "True" : "False"}" size="${isArray && arrayLength ? escapeXmlAttribute(String(arrayLength)) : ""}"/>`
        );
        break;
      }
      case "assign": {
        const assignment = convertAssignmentToFlowgorithm(node);
        lines.push(
          `${indent}<assign variable="${escapeXmlAttribute(assignment.variableName)}" expression="${escapeXmlAttribute(assignment.expression)}"/>`
        );
        break;
      }
      case "input":
        lines.push(`${indent}<input variable="${escapeXmlAttribute(node.value.trim())}"/>`);
        break;
      case "output":
        {
          const appendNewline = node.outputConfig?.appendNewline !== false;
        lines.push(
          `${indent}<output expression="${escapeXmlAttribute(formatTemplateAsFlowgorithmOutputExpression(node.value))}" newline="${appendNewline ? "True" : "False"}"/>`
        );
        break;
        }
      case "comment":
        lines.push(`${indent}<comment text="${escapeXmlAttribute(node.value)}"/>`);
        break;
      case "call":
        lines.push(`${indent}<call expression="${escapeXmlAttribute(node.value)}"/>`);
        break;
      case "if": {
        lines.push(`${indent}<if expression="${escapeXmlAttribute(node.value)}">`);
        lines.push(`${indent}${CODEGEN_INDENT}<then>`);
        lines.push(...exportNodesToFlowgorithmXml(node.branches?.trueBranch ?? [], indentLevel + 2));
        lines.push(`${indent}${CODEGEN_INDENT}</then>`);
        lines.push(`${indent}${CODEGEN_INDENT}<else>`);
        lines.push(...exportNodesToFlowgorithmXml(node.branches?.falseBranch ?? [], indentLevel + 2));
        lines.push(`${indent}${CODEGEN_INDENT}</else>`);
        lines.push(`${indent}</if>`);
        break;
      }
      case "while":
        lines.push(`${indent}<while expression="${escapeXmlAttribute(node.value)}">`);
        lines.push(...exportNodesToFlowgorithmXml(node.branches?.body ?? [], indentLevel + 1));
        lines.push(`${indent}</while>`);
        break;
      case "for": {
        const config = node.forConfig ?? {};
        const includeEndText = config.includeEnd === false ? "False" : "True";
        lines.push(
          `${indent}<for variable="${escapeXmlAttribute(config.variable ?? "")}" start="${escapeXmlAttribute(config.start ?? "")}" end="${escapeXmlAttribute(config.end ?? "")}" step="${escapeXmlAttribute(config.step ?? "1")}" algoflow-inclusive="${includeEndText}">`
        );
        lines.push(...exportNodesToFlowgorithmXml(node.branches?.body ?? [], indentLevel + 1));
        lines.push(`${indent}</for>`);
        break;
      }
      case "do":
        lines.push(`${indent}<do expression="${escapeXmlAttribute(node.value)}">`);
        lines.push(...exportNodesToFlowgorithmXml(node.branches?.body ?? [], indentLevel + 1));
        lines.push(`${indent}</do>`);
        break;
      default:
        throw new Error(`Il nodo di tipo "${node.type}" non può essere esportato in Flowgorithm.`);
    }
  });

  return lines;
};

const buildFlowgorithmXmlDocument = () => {
  const xmlLines = [
    '<?xml version="1.0"?>',

    `${CODEGEN_INDENT.repeat(2)}<attribute name="about" value="Exported from AlgoFlow"/>`,

    `${CODEGEN_INDENT}</attributes>`,
